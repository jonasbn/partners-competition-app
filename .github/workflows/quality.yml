name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests with coverage
      run: npm run test:coverage

    - name: Check test coverage
      run: |
        echo "📊 Test Coverage Report"
        if [ -d "coverage" ]; then
          echo "✅ Coverage directory found"
          ls -la coverage/
        else
          echo "⚠️  No coverage directory found"
        fi

    - name: Upload coverage reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30

    - name: Build and verify
      run: |
        echo "🔨 Building application..."
        npm run build
        echo "✅ Build completed successfully"
        
        echo "📦 Build artifact info:"
        du -sh build/
        find build/ -name "*.js" -o -name "*.css" -o -name "*.html" | head -10

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Lint (oxlint)
      run: npm run oxlint

    - name: Check for formatting scripts
      run: |
        if npm run format:check --dry-run 2>/dev/null; then
          echo "✅ Format check script available"
          npm run format:check
        else
          echo "⚠️  No format check script found in package.json"
        fi